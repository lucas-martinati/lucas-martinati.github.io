<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable (404) — Lucas Martinati</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#030712">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 520px;
            width: 100%;
            text-align: center;
            padding: 2.5rem 2rem;
            border-radius: 22px;
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }
        .code {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.14);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 999px;
            padding: 0.3rem 0.9rem;
            margin-bottom: 1.25rem;
        }
        h1 {
            font-size: clamp(1.75rem, 5vw, 2.3rem);
            font-weight: 800;
            margin-bottom: 0.75rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 1.85rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.75rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        a:hover { transform: translateY(-2px); }
        a:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
        .primary {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
        }
        .secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #f8fafc;
        }
    </style>
</head>

<body>
    <main>
        <span class="code">ERREUR 404</span>
        <h1>Page introuvable</h1>
        <p>Cette adresse n'existe pas ou a été déplacée. Vous pouvez revenir au portfolio ou consulter directement mon CV.</p>
        <div class="actions">
            <a class="primary" href="/">Retour au portfolio</a>
            <a class="secondary" href="/cv/">Voir mon CV</a>
        </div>
    </main>
</body>

</html>
