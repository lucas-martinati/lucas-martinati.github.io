<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable (404) — Lucas Martinati</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0c0f13">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: radial-gradient(ellipse 75% 45% at 20% 0%, rgba(16, 128, 124, 0.16), transparent 65%), #0c0f13;
            color: #f3efe6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.65;
        }
        main {
            max-width: 520px;
            width: 100%;
            text-align: left;
            padding: 2.5rem 2.25rem;
            border-radius: 18px;
            background: #131820;
            border: 1px solid rgba(243, 239, 230, 0.12);
            border-top: 2px solid #38cfc1;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }
        .code {
            display: inline-block;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #38cfc1;
            margin-bottom: 0.9rem;
        }
        h1 {
            font-size: clamp(1.75rem, 5vw, 2.25rem);
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }
        p {
            color: #a4adb9;
            margin-bottom: 1.85rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.7rem 1.35rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        a:hover { transform: translateY(-2px); }
        a:focus-visible { outline: 2.5px solid #38cfc1; outline-offset: 3px; }
        .primary {
            background: #f3efe6;
            color: #0c0f13;
        }
        .secondary {
            background: rgba(243, 239, 230, 0.05);
            border: 1px solid rgba(243, 239, 230, 0.16);
            color: #f3efe6;
        }
    </style>
</head>

<body>
    <main>
        <span class="code">ERREUR 404</span>
        <h1>Page introuvable</h1>
        <p>Cette adresse n'existe pas ou a été déplacée. Vous pouvez revenir au portfolio ou consulter directement mon CV.</p>
        <div class="actions">
            <a class="primary" href="/">Retour au portfolio</a>
            <a class="secondary" href="/cv/">Voir mon CV</a>
        </div>
    </main>
</body>

</html>
